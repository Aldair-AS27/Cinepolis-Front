<section class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
  @if (cargando()) {
    <div class="glass-panel rounded-3xl p-10">
      <app-skeleton-loader [filas]="8" />
    </div>
  } @else if (error()) {
    <div class="glass-panel rounded-3xl p-10 text-center">
      <p class="font-display text-lg text-gold-light">💺 {{ error() }}</p>
    </div>
  } @else {
    <header class="mb-8">
      <p class="text-[11px] uppercase tracking-[0.35em] text-gold-dark">Elige tus butacas</p>
      <h1 class="mt-2 font-display text-3xl font-black text-white sm:text-4xl">
        {{ pelicula()?.titulo ?? 'Función seleccionada' }}
      </h1>
      <p class="mt-2 text-sm text-slate-400">
        {{ funcion()?.sala?.nombre }} · {{ funcion()?.formato }} · {{ funcion()?.idioma }}
      </p>
    </header>

    <div class="grid gap-8 lg:grid-cols-[1fr_360px]">
      <app-seat-grid
        [butacas]="butacas()"
        [seleccionadas]="seleccionadas()"
        (butacaToggle)="toggleButaca($event)"
      />

      <div class="lg:sticky lg:top-24 lg:self-start">
        <app-booking-summary
          [pelicula]="pelicula()"
          [funcion]="funcion()"
          [seleccionadas]="seleccionadas()"
        />
      </div>
    </div>
  }
</section>
