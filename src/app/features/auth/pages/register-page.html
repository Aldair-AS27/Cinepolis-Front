<section class="flex min-h-[80vh] items-center justify-center px-4 py-12">
  <div class="glass-panel w-full max-w-md rounded-2xl border border-white/10 p-8 shadow-2xl">
    <div class="mb-6 text-center">
      <p class="text-xs font-semibold uppercase tracking-[0.25em] text-gold">Club Cinépolis</p>
      <h1 class="mt-1 font-display text-2xl font-bold text-white">Crear Cuenta</h1>
      <p class="mt-1 text-sm text-slate-400">Regístrate para reservar butacas y ver tus boletos</p>
    </div>

    <form (ngSubmit)="registrar()" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mb-1 block text-xs uppercase tracking-wider text-slate-400">Nombres *</label>
          <input
            type="text"
            name="nombres"
            [(ngModel)]="form.nombres"
            required
            class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none focus:border-gold/60"
          />
        </div>
        <div>
          <label class="mb-1 block text-xs uppercase tracking-wider text-slate-400">Apellidos *</label>
          <input
            type="text"
            name="apellidos"
            [(ngModel)]="form.apellidos"
            required
            class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none focus:border-gold/60"
          />
        </div>
      </div>

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wider text-slate-400">Correo Electrónico *</label>
        <input
          type="email"
          name="correoElectronico"
          [(ngModel)]="form.correoElectronico"
          required
          placeholder="cliente@correo.com"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none focus:border-gold/60"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wider text-slate-400">Teléfono</label>
        <input
          type="tel"
          name="telefono"
          [(ngModel)]="form.telefono"
          placeholder="987654321"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none focus:border-gold/60"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wider text-slate-400">Contraseña *</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          required
          minlength="6"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none focus:border-gold/60"
        />
      </div>

      @if (error()) {
        <div class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-2.5 text-xs text-red-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-xl bg-gold py-3 font-display text-xs font-bold uppercase tracking-widest text-slate-950 transition hover:bg-gold-light disabled:opacity-50"
      >
        {{ loading() ? 'Registrando...' : 'Crear mi Cuenta' }}
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-400">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="font-semibold text-gold hover:underline">Inicia sesión aquí</a>
    </p>
  </div>
</section>
