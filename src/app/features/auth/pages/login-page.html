<section class="flex min-h-[75vh] items-center justify-center px-4 py-12">
  <div class="glass-panel w-full max-w-md rounded-2xl border border-white/10 p-8 shadow-2xl">
    <div class="mb-6 text-center">
      <span class="text-xs font-semibold uppercase tracking-[0.25em] text-gold">
        Panel Administrativo
      </span>
      <h1 class="mt-2 font-display text-2xl font-bold text-white">
        Iniciar Sesión
      </h1>
      <p class="mt-1 text-sm text-slate-400">
        Acceso exclusivo para personal autorizado de Cinépolis
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-slate-300">
          Correo electrónico
        </label>
        <input
          type="email"
          name="correoElectronico"
          [(ngModel)]="correoElectronico"
          required
          placeholder="admin@cinepolis.com"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition focus:border-gold/60"
        />
      </div>

      <div>
        <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-slate-300">
          Contraseña
        </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition focus:border-gold/60"
        />
      </div>

      @if (error()) {
        <div class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-xs text-red-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-xl bg-gold py-3 font-display text-sm font-bold uppercase tracking-widest text-slate-950 transition hover:bg-gold-light disabled:opacity-50"
      >
        {{ loading() ? 'Verificando...' : 'Ingresar al Dashboard' }}
      </button>
    </form>
  </div>
</section>
