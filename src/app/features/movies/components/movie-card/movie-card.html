<article
  class="glass-panel group relative flex h-full flex-col overflow-hidden rounded-2xl transition-all duration-500 hover:-translate-y-1 hover:shadow-gold-glow"
>
  <div class="relative aspect-[2/3] overflow-hidden">
    <img
      [src]="pelicula().posterUrl"
      [alt]="'Póster de ' + pelicula().titulo"
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-cinepolis-bg via-cinepolis-bg/20 to-transparent"></div>

    <div class="absolute left-3 top-3">
      <app-badge-sala [texto]="pelicula().formatoDestacado" />
    </div>
    <span
      class="absolute right-3 top-3 rounded-lg border border-white/15 bg-cinepolis-bg/70 px-2 py-1 text-[11px] font-bold text-gold-light backdrop-blur-glass"
    >
      {{ pelicula().clasificacion }}
    </span>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <div>
      <h3 class="font-display text-lg font-bold leading-snug text-white">
        {{ pelicula().titulo }}
      </h3>
      <p class="mt-1 text-xs uppercase tracking-[0.2em] text-slate-400">
        {{ pelicula().genero }} · {{ pelicula().duracionMinutos | duration }}
      </p>
    </div>

    <p class="line-clamp-3 text-sm leading-relaxed text-slate-400">
      {{ pelicula().sinopsis }}
    </p>

    <div class="mt-auto pt-2">
      <app-gold-button [anchoCompleto]="true" [disabled]="pelicula().estado === 'PROXIMAMENTE'" (presionado)="verFunciones.emit(pelicula())">
        {{ pelicula().estado === 'PROXIMAMENTE' ? 'Próximamente' : 'Ver funciones' }}
      </app-gold-button>
    </div>
  </div>
</article>
