<div class="glass-panel flex flex-col gap-5 rounded-2xl p-5 sm:p-6 lg:flex-row lg:items-center lg:justify-between">
  <label class="relative w-full lg:max-w-sm">
    <span class="sr-only">Buscar película</span>
    <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">🔍</span>
    <input
      type="search"
      placeholder="Buscar película..."
      (input)="actualizarBusqueda($any($event.target).value)"
      class="w-full rounded-xl border border-white/10 bg-cinepolis-deep/70 py-3 pl-11 pr-4 text-sm text-slate-100 placeholder:text-slate-500 transition-colors focus:border-gold/60 focus:outline-none focus:ring-1 focus:ring-gold/40"
    />
  </label>

  <div class="flex flex-wrap items-center gap-6">
    <div class="flex flex-wrap items-center gap-2">
      @for (opcion of formatos; track opcion) {
        <button
          type="button"
          (click)="cambiarFormato(opcion)"
          class="rounded-full border px-4 py-2 font-display text-[11px] font-semibold uppercase tracking-[0.2em] transition-all duration-300"
          [class]="formato() === opcion
            ? 'border-gold bg-gold/20 text-gold-light shadow-gold-glow'
            : 'border-white/10 bg-white/5 text-slate-400 hover:border-gold/40 hover:text-gold-light'"
        >
          {{ opcion }}
        </button>
      }
    </div>

    <div class="flex flex-wrap items-center gap-2">
      @for (opcion of estados; track opcion) {
        <button
          type="button"
          (click)="cambiarEstado(opcion)"
          class="rounded-full border px-4 py-2 text-[11px] uppercase tracking-[0.2em] transition-all duration-300"
          [class]="estado() === opcion
            ? 'border-gold/60 bg-gold/10 text-gold-light'
            : 'border-transparent text-slate-500 hover:text-slate-300'"
        >
          {{ opcion }}
        </button>
      }
    </div>
  </div>
</div>
