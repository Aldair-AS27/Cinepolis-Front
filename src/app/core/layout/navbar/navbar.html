<header class="glass-panel fixed inset-x-0 top-0 z-50 border-b border-white/5">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="group flex items-center gap-3" aria-label="Cinépolis inicio">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-xl border border-gold/40 bg-gold/10 text-lg shadow-gold-glow transition-transform duration-300 group-hover:scale-110"
      >
        🎬
      </span>
      <span class="gold-gradient-text font-display text-xl font-black tracking-[0.35em] sm:text-2xl">
        CINÉPOLIS
      </span>
    </a>

    <div class="flex items-center gap-6">
      <a
        routerLink="/"
        routerLinkActive="text-gold-light"
        [routerLinkActiveOptions]="{ exact: true }"
        class="font-display text-sm font-semibold uppercase tracking-[0.2em] text-slate-300 transition-colors duration-300 hover:text-gold"
      >
        Cartelera
      </a>
     @if (authService.isAdmin()) {
      <a
    routerLink="/admin/dashboard"
    routerLinkActive="text-gold-light"
    class="font-display text-sm font-semibold uppercase tracking-[0.2em] text-slate-300 transition-colors duration-300 hover:text-gold"
  >
         Dashboard
     </a>
  <button
    (click)="authService.logout()"
    class="font-display text-xs font-semibold uppercase tracking-[0.2em] text-red-400 transition-colors hover:text-red-300"
  >
        Salir
  </button>
} @else if (authService.isLoggedIn()) {
  <span class="font-display text-xs font-semibold uppercase tracking-[0.15em] text-gold">
    Hola, {{ authService.userName() }}
  </span>
  <button
    (click)="authService.logout()"
    class="font-display text-xs font-semibold uppercase tracking-[0.2em] text-red-400 transition-colors hover:text-red-300"
      >
    Salir
  </button>
} @else {
  <a
    routerLink="/login"
    routerLinkActive="text-gold-light"
    class="font-display text-xs font-semibold uppercase tracking-[0.2em] text-slate-300 transition-colors duration-300 hover:text-gold"
  >
    Ingresar
  </a>
  <a
    routerLink="/registro"
    class="rounded-lg bg-gold px-3.5 py-1.5 font-display text-xs font-bold uppercase tracking-[0.15em] text-slate-950 transition hover:bg-gold-light"
  >
        Registro
        </a>
    }
    
    </div>
  </nav>
</header>
